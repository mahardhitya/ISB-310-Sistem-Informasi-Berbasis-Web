<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Sederhana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-card">
        <div class="header-banner">
            <img src="../evaluasi1/assets/gedungitenas.png" alt="Itenas Cover">
            <img src="../evaluasi1/assets/gedungitenas.png" alt="Itenas Cover">
            <img src="../evaluasi1/assets/gedungitenas.png" alt="Itenas Cover">
            <img src="../evaluasi1/assets/gedungitenas.png" alt="Itenas Cover">
            <img src="../evaluasi1/assets/gedungitenas.png" alt="Itenas Cover">
            <img src="../evaluasi1/assets/gedungitenas.png" alt="Itenas Cover">
        </div>

        
        <div class="content-wrapper">
            <div class="sidebar">
                <a href="#" class="nav-link active" onclick="showPage('home')">Home</a>
                <a href="#" class="nav-link" onclick="showPage('menu')">Menu</a>
                <a href="#" class="nav-link" onclick="showPage('calculator')">Calculator</a>
            </div>

            <div class="main-content">
                <div id="page-home" class="page">
                    <table class="home-table">
                        <tr>
                            <td>klik button disamping &gt;&gt;</td>
                            <td><button type="button" class="btn-shout" onclick="shout()">Shout</button></td>
                        </tr>
                    </table>
                </div>

                <div id="page-menu" class="page" style="display:none;">
                    <div class="menu-wrapper">
                        <table class="menu-table">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Makanan/Minuman</th>
                                    <th>Harga</th>
                                    <th>Pesan</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>Bakso Istimewa</td>
                                    <td>@ Rp 12000</td>
                                    <td><input type="number" id="pesan1" value="0" min="0" onchange="hitungTotal()"></td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>Soto Spesial</td>
                                    <td>@ Rp 10000</td>
                                    <td><input type="number" id="pesan2" value="0" min="0" onchange="hitungTotal()"></td>
                                </tr>
                                <tr>
                                    <td>3</td>
                                    <td>Mie Ayam Super</td>
                                    <td>@ Rp 15000</td>
                                    <td><input type="number" id="pesan3" value="0" min="0" onchange="hitungTotal()"></td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="summary-label">Jumlah Total</td>
                                    <td><input type="text" id="jumlahTotal" value="0" readonly></td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="summary-label">Diskon</td>
                                    <td><input type="text" id="diskon" value="0" readonly></td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="summary-label">Jumlah Bayar</td>
                                    <td><input type="text" id="jumlahBayar" value="0" readonly></td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="reset-cell">
                            <button type="button" class="btn-reset-menu" onclick="resetMenu()">Reset</button>
                        </div>
                    </div>
                </div>

                <div id="page-calculator" class="page" style="display:none;">
                    <table class="calc-table">
                        <tr>
                            <td><input type="number" id="angka1" placeholder=""></td>
                            <td>
                                <select id="operator">
                                    <option value="+">+</option>
                                    <option value="-">-</option>
                                    <option value="*">*</option>
                                    <option value="/">/</option>
                                    <option value="%">%</option>
                                    <option value="^">^</option>
                                </select>
                            </td>
                            <td><input type="number" id="angka2" placeholder=""></td>
                            <td>=</td>
                            <td><input type="text" id="hasil" readonly></td>
                        </tr>
                    </table>
                    <div class="form-buttons">
                        <button type="button" onclick="hitung()">Hitung</button>
                        <button type="button" onclick="resetCalc()">Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>162023023</p>
            <p>Sistem Informasi | ITENAS 2026</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
