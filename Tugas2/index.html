<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Layout Presisi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
    <header class="main-header">
        <div class="header-holes"></div>
        <div class="header-title">
            <h1>Soal Pertama :)</h1>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <h2 class="dotted-title">Menu</h2>
            <ul class="nav-list">
                <li><a href="#">Soal Pertama</a></li>
                <li><a href="#">Soal Kedua</a></li>
            </ul>

            <h2 class="dotted-title">Search</h2>
            <div class="search-group">
                <input type="text" placeholder="Search this web">
                <button>GO!</button>
            </div>
        </aside>

        <main class="content">
            <h2 class="content-title">Tabel Sesuatu</h2>
            <div class="table-container">
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Huruf</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>1</td><td>A</td><td>Pertama</td></tr>
                        <tr><td>2</td><td>B</td><td>Kedua</td></tr>
                        <tr><td>3</td><td>C</td><td>Ketiga</td></tr>
                    </tbody>
                    <tfoot>
                        <tr><td colspan="3">Data di atas adalah data fiktif</td></tr>
                    </tfoot>
                </table>
            </div>
        </main>
    </div>
</div>

</body>
</html>
