<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal Kedua - Formulir</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="main-header">
            <div class="header-holes"></div>
            <div class="header-title">
                <h1>Soal Pertama :)</h1>
            </div>
        </header>

        <main class="content-full">
            <h2 class="content-title" style="margin-bottom: 20px;">Formulir Entah Apa</h2>
            
            <div class="form-box">
                <form>
                    <div class="form-row-bg">
                        <label class="label-box">Username</label>
                        <div class="input-box">
                            <input type="text" placeholder="Username">
                        </div>
                    </div>

                    <div class="form-row-bg">
                        <label class="label-box">Password</label>
                        <div class="input-box">
                            <input type="password" placeholder="Password">
                        </div>
                    </div>

                    <div class="form-row-bg">
                        <label class="label-box">Verification Code</label>
                        <div class="input-box">
                            <input type="text" placeholder="Isi kode anda">
                        </div>
                    </div>
                    
                    <div class="form-row-bg footer-row">
                        <div class="remember-group">
                            <input type="checkbox" id="rem">
                            <label for="rem" style="color: #21678A;">Remember Me</label>
                        </div>
                    </div>

                    <div class="submit-wrapper">
                        <button type="submit" class="btn-submit">Submit</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
